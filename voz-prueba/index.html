<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rumbo · prueba de voz</title>
<style>
  :root { --bg:#0f1720; --card:#17222e; --line:#26364a; --text:#e6edf3; --muted:#8b9bb0; --accent:#3ddc97; --warn:#f5b84b; --danger:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:1100px; margin:0 auto; padding:24px; display:grid; grid-template-columns: 1fr 1fr; gap:20px; }
  header { grid-column: 1 / -1; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  h1 { margin:0; font-size:22px; } h1 small { color:var(--muted); font-weight:400; font-size:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .card h2 { margin:0 0 10px; font-size:14px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  button { font:inherit; border:1px solid var(--line); background:#1f2d3c; color:var(--text); border-radius:8px; padding:8px 12px; cursor:pointer; }
  button:hover { border-color:var(--accent); } button:disabled { opacity:.5; cursor:default; }
  #mic { width:96px; height:96px; border-radius:50%; font-size:36px; background:#1f2d3c; display:block; margin:8px auto; }
  #mic.live { background:var(--accent); color:#06281a; } #mic.speaking { animation:pulse 1s infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 0 14px rgba(61,220,151,.15); } }
  #status { text-align:center; color:var(--muted); min-height:1.5em; }
  .prompts { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; } .prompts button { font-size:13px; padding:5px 9px; }
  form { display:flex; gap:8px; margin-top:10px; } input { flex:1; font:inherit; padding:8px; border-radius:8px; border:1px solid var(--line); background:#0f1720; color:var(--text); }
  #chat { height:340px; overflow:auto; display:flex; flex-direction:column; gap:8px; }
  .msg { padding:8px 11px; border-radius:10px; max-width:90%; white-space:pre-wrap; }
  .msg.user { align-self:flex-end; background:#24425f; } .msg.ai { align-self:flex-start; background:#1f2d3c; }
  .msg.sys { align-self:center; color:var(--muted); font-size:13px; background:none; }
  .msg.err { align-self:center; color:var(--danger); font-size:13px; background:none; }
  #tools { max-height:340px; overflow:auto; } details { border-top:1px solid var(--line); padding:6px 0; }
  summary { cursor:pointer; } summary code { color:var(--accent); } .ms { color:var(--muted); font-size:12px; }
  pre { margin:6px 0 0; font-size:12px; background:#0f1720; padding:8px; border-radius:8px; overflow:auto; max-height:220px; }
  #panel dl { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; margin:0; } dt { color:var(--muted); } dd { margin:0; }
  .alert { margin:4px 0; } .alert.warn { color:var(--warn); } .alert.danger { color:var(--danger); }
  .wide { grid-column: 1 / -1; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Rumbo <small>· prueba del asesor por voz contra la API de Python</small></h1>
    <div>
      <span id="apiInfo" class="ms"></span>
      <button id="advance">Avanzar 30 días</button>
      <button id="reset">Reiniciar demo</button>
    </div>
  </header>

  <section class="card">
    <h2>Asesor</h2>
    <button id="mic" aria-label="Hablar con el asesor">🎙️</button>
    <p id="status">Pulsa el micrófono y pregunta en voz alta</p>
    <div class="prompts" id="prompts"></div>
    <form id="textForm">
      <input id="textInput" placeholder="…o escribe (con la llamada abierta)" autocomplete="off">
      <button>Enviar</button>
    </form>
  </section>

  <section class="card">
    <h2>Panel (GET /api/state)</h2>
    <div id="panel">Cargando…</div>
  </section>

  <section class="card">
    <h2>Conversación</h2>
    <div id="chat"></div>
  </section>

  <section class="card">
    <h2>Tools llamadas por el agente</h2>
    <div id="tools"><p class="ms">Aún ninguna.</p></div>
  </section>
</main>

<!-- ElevenLabs client SDK (bundle autocontenido; expone window.ElevenLabsClient) -->
<script src="https://cdn.jsdelivr.net/npm/@elevenlabs/client@1.36.0/dist/lib.iife.js"></script>
<script>
// API de Python. Se puede cambiar con ?api=http://otra-url:8000
const API = new URLSearchParams(location.search).get('api') || `http://${location.hostname}:8000`;

// Mismos nombres y endpoints que backend/contract/client_tools.json
const TOOLS = {
  get_days_by_country:  { method: 'GET',  path: '/api/tools/days',      params: 'query' },
  get_residency_status: { method: 'GET',  path: '/api/tools/residency', params: 'query' },
  get_day_budget:       { method: 'GET',  path: '/api/tools/budget',    params: null },
  simulate_stay:        { method: 'POST', path: '/api/tools/simulate',  params: 'body' },
  get_tax_reserve:      { method: 'GET',  path: '/api/tools/reserve',   params: null },
  register_expense:     { method: 'POST', path: '/api/tools/expenses',  params: 'body', refresh: true },
  answer_question:      { method: 'POST', path: '/api/tools/answers',   params: 'body', refresh: true },
  get_alerts:           { method: 'GET',  path: '/api/tools/alerts',    params: null },
  generate_dossier:     { method: 'POST', path: '/api/tools/dossier',   params: null },
};

const PROMPTS = [
  'Me han ofrecido quedarme dos meses más en Lisboa. ¿Me afecta?',
  '¿Dónde soy residente fiscal este año?',
  '¿Cuántos días me quedan en Portugal?',
  '¿Cuánto tengo apartado para impuestos?',
  'Coworking en Lisboa, 80 euros',
  '¿Tengo algún aviso?',
];

const $ = (id) => document.getElementById(id);
const euros = (c) => (c / 100).toLocaleString('es-ES', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

async function call(method, path, body) {
  const r = await fetch(API + path, {
    method,
    headers: body !== undefined ? { 'Content-Type': 'application/json' } : undefined,
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof data.detail === 'string' ? data.detail : `HTTP ${r.status}: ${JSON.stringify(data.detail ?? data)}`);
  return data;
}

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  $('chat').append(div);
  $('chat').scrollTop = $('chat').scrollHeight;
}

let toolCount = 0;
function logTool(name, args, result, ms, error) {
  if (!toolCount++) $('tools').innerHTML = '';
  const d = document.createElement('details');
  d.open = true;
  d.innerHTML = `<summary><code>${esc(name)}</code>(${esc(JSON.stringify(args || {}))}) <span class="ms">${ms} ms${error ? ' · ERROR' : ''}</span></summary>`
    + `<pre>${esc(error ? error : JSON.stringify(result, null, 2))}</pre>`;
  $('tools').prepend(d);
  for (const old of [...$('tools').children].slice(1)) old.open = false;
}

async function refreshPanel() {
  try {
    const s = await call('GET', '/api/state');
    const days = s.days?.days || s.budget?.items?.reduce((a, i) => ({ ...a, [i.country]: i.days_used }), {}) || {};
    const claims = (s.residency?.claims || []).map((c) => `${c.country_name_es || c.country} (${c.status})`).join(', ') || '—';
    const budget = (s.budget?.items || []).map((i) => `<div>${esc(i.message_es || `${i.country}: ${i.days_left} días`)}</div>`).join('');
    const alerts = (s.alerts?.alerts || []).map((a) => `<div class="alert ${esc(a.level)}">• ${esc(a.title_es)}</div>`).join('');
    $('panel').innerHTML = `<dl>
      <dt>Hoy (demo)</dt><dd>${esc(s.clock?.today)}</dd>
      <dt>Días</dt><dd>${esc(Object.entries(days).map(([k, v]) => `${k} ${v}`).join(' · ') || '—')}</dd>
      <dt>Residencia</dt><dd>${esc(claims)} · confianza ${esc(s.residency?.confidence)}${s.residency?.dual_residency ? ' · <b>doble residencia</b>' : ''}</dd>
      <dt>Umbrales</dt><dd>${budget || '—'}</dd>
      <dt>Hucha</dt><dd>${s.reserve ? esc(s.reserve.summary_es || euros(s.reserve.reserved_cents)) : '—'}</dd>
      <dt>Avisos</dt><dd>${alerts || '—'}</dd>
    </dl>`;
    $('apiInfo').textContent = `API ${API} · ElevenLabs ${s.modes?.elevenlabs ? '✓' : '✗ (sin claves)'}`;
  } catch (e) {
    $('panel').innerHTML = `<p class="msg err">No llego a la API en ${esc(API)}: ${esc(e.message)}.<br>¿Está corriendo <code>make dev</code> en backend/?</p>`;
  }
}

// Handlers de client tools: llaman a la API y devuelven el JSON al agente.
const clientTools = Object.fromEntries(Object.entries(TOOLS).map(([name, t]) => [name, async (params = {}) => {
  const t0 = performance.now();
  try {
    let path = t.path, body;
    const clean = Object.fromEntries(Object.entries(params).filter(([, v]) => v !== null && v !== undefined && v !== ''));
    if (t.params === 'query' && Object.keys(clean).length) path += '?' + new URLSearchParams(clean);
    if (t.method === 'POST') body = t.params === 'body' ? clean : {};
    const result = await call(t.method, path, body);
    logTool(name, params, result, Math.round(performance.now() - t0));
    if (t.refresh) refreshPanel();
    if (name === 'generate_dossier' && result.url) addMsg('sys', `Expediente: ${result.url}`);
    return JSON.stringify(result);
  } catch (e) {
    logTool(name, params, null, Math.round(performance.now() - t0), e.message);
    return JSON.stringify({ error: e.message });
  }
}]));

let conversation = null;
function setStatus(text) { $('status').textContent = text; }

async function toggleCall() {
  const mic = $('mic');
  if (conversation) { await conversation.endSession(); return; }
  mic.disabled = true;
  setStatus('Conectando…');
  try {
    await navigator.mediaDevices.getUserMedia({ audio: true });
    const { signed_url } = await call('GET', '/api/voice/signed-url');
    conversation = await ElevenLabsClient.Conversation.startSession({
      signedUrl: signed_url,
      clientTools,
      onConnect: () => { mic.classList.add('live'); mic.textContent = '📞'; setStatus('Te escucho. Pulsa para colgar.'); addMsg('sys', 'Llamada iniciada'); },
      onDisconnect: () => { conversation = null; mic.classList.remove('live', 'speaking'); mic.textContent = '🎙️'; setStatus('Llamada terminada. Pulsa para volver a llamar.'); addMsg('sys', 'Llamada terminada'); },
      onMessage: (m) => addMsg((m.role || m.source) === 'user' ? 'user' : 'ai', ElevenLabsClient.stripAudioTags(m.message)),
      onModeChange: ({ mode }) => { mic.classList.toggle('speaking', mode === 'speaking'); if (conversation) setStatus(mode === 'speaking' ? 'Rumbo está hablando' : 'Te escucho. Pulsa para colgar.'); },
      onError: (msg) => addMsg('err', 'Error: ' + msg),
      onUnhandledClientToolCall: (c) => addMsg('err', `El agente pidió una tool que no está registrada: ${c?.tool_name}`),
    });
  } catch (e) {
    const hint = /404/.test(e.message) || /not configured|no.*clave/i.test(e.message) ? ' (faltan ELEVENLABS_API_KEY / ELEVENLABS_AGENT_ID en backend/.env)' : '';
    addMsg('err', 'No se pudo iniciar: ' + e.message + hint);
    setStatus('Pulsa el micrófono y pregunta en voz alta');
  } finally {
    mic.disabled = false;
  }
}

function sendText(text) {
  if (!text) return;
  if (!conversation) { addMsg('err', 'Abre primero la llamada con el micrófono.'); return; }
  conversation.sendUserMessage(text);
  addMsg('user', text + '  ⌨️');
}

$('mic').onclick = toggleCall;
$('textForm').onsubmit = (e) => { e.preventDefault(); sendText($('textInput').value.trim()); $('textInput').value = ''; };
for (const p of PROMPTS) {
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = p; b.title = 'Envía la frase como texto (con la llamada abierta)';
  b.onclick = () => sendText(p);
  $('prompts').append(b);
}
$('advance').onclick = async () => { await call('POST', '/api/clock/advance', { days: 30 }); refreshPanel(); };
$('reset').onclick = async () => { await call('POST', '/api/demo/reset', {}); refreshPanel(); addMsg('sys', 'Demo reiniciada'); };

refreshPanel();
</script>
</body>
</html>
